<?xml version="1.0" encoding="UTF-8"?>
<!-- Yandex Messenger launcher: brand yellow plate + black chat bubble + yellow dots -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Squircle plate (iOS/Android adaptive-friendly) -->
  <rect width="512" height="512" rx="108" fill="#FFCC00"/>

  <!-- Chat bubble — flat black, classic messenger silhouette -->
  <path fill="#1A1A1A" d="
    M 128 148
    h 256
    c 30 0 54 24 54 54
    v 140
    c 0 30 -24 54 -54 54
    H 236
    l -64 66
    v -66
    H 128
    c -30 0 -54 -24 -54 -54
    V 202
    c 0 -30 24 -54 54 -54
    z"/>

  <!-- Three message dots (brand yellow on black) -->
  <circle cx="200" cy="252" r="24" fill="#FFCC00"/>
  <circle cx="256" cy="252" r="24" fill="#FFCC00"/>
  <circle cx="312" cy="252" r="24" fill="#FFCC00"/>
</svg>
